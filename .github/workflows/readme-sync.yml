name: README sync

on:
  pull_request:
    paths:
      - README.md
      - profile/README.md
      - scripts/sync-readme.sh
  push:
    branches: [main]
    paths:
      - README.md
      - profile/README.md
      - scripts/sync-readme.sh

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/sync-readme.sh --check
