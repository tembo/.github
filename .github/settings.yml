# These settings are synced by https://github.com/apps/settings.
# Keep every shared label here: labels omitted from this list are deleted on sync.

labels:
  - name: bug
    color: '#d73a4a'
    description: Something isn't working
  - name: dependencies
    color: '#0366d6'
    description: Pull requests that update a dependency file
  - name: documentation
    color: '#0075ca'
    description: Improvements or additions to documentation
  - name: duplicate
    color: '#cfd3d7'
    description: This issue or pull request already exists
  - name: invalid
    color: '#e4e669'
    description: This doesn't seem right
  - name: major
    color: '#b60205'
    description: Major version bump
  - name: minor
    color: '#fbca04'
    description: Minor version bump
  - name: patch
    color: '#0e8a16'
    description: Patch version bump
  - name: question
    color: '#d876e3'
    description: Further information is requested
  - name: tembo
    color: '#ffffff'
    description: Pull request created by Tembo
  - name: wontfix
    color: '#ffffff'
    description: This will not be worked on
