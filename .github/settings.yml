  - name: question
    color: '#d876e3'
    description: Further information is requested
  - name: shared
    color: '#dda7c0'
    description: Changes matching the repository’s shared path rules.
  - name: stale
    color: '#ededed'
    description: Pull request marked inactive by the stale workflow
  - name: tembo
    color: '#ffffff'
    description: Pull request created by Tembo
  - name: tooling
    color: '#bbdda6'
    description: Changes matching the repository’s tooling path rules.
  - name: wip
    color: '#fbca04'
    description: Work in progress; exempt from automatic stale closure
  - name: wontfix
    color: '#ffffff'
